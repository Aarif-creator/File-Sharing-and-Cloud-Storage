name: CI

on:
  push:
    branches: [ "feat/add-ci-and-dependabot", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  node:
    name: Node.js build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript + Vite)
        run: npm run build

      - name: Lint
        run: npm run lint || true

  php:
    name: PHP tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, xml, zip
          coverage: none

      - name: Install Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run phpunit (if present)
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit --colors=always || true
          else
            echo "No phpunit found — skipping"
          fi
